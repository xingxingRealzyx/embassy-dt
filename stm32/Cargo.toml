[package]
name = "embassy-dt-stm32"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "STM32 backend for embassy-dt (async device tree for Embassy)."
keywords = ["embassy", "embedded", "async", "device-tree", "stm32"]
categories = ["embedded", "no-std"]
documentation = "https://docs.rs/embassy-dt-stm32"
readme = "README.md"

[dependencies]
embassy-dt = { path = "..", version = "0.1.0" }
embassy-embedded-hal = "0.6"
embassy-stm32 = { version = "0.6", default-features = false, features = ["time-driver-any", "exti"] }
embassy-sync = "0.8"

[features]
default = ["stm32h723zg"]
stm32h723zg = ["embassy-stm32/stm32h723zg"]
stm32f411ce = ["embassy-stm32/stm32f411ce"]

[dev-dependencies]
cortex-m-rt = "0.7"
critical-section = { version = "1", features = ["restore-state-bool"] }
defmt = "1"
defmt-rtt = "1"
embassy-stm32 = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"
embedded-hal-async = "1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5"
embassy-usb = { version = "0.6", features = ["defmt"] }
embassy-dt-bme280 = { path = "../drivers/bme280" }
panic-probe = "1"
usbd-hid = "0.10"

[package.metadata.docs.rs]
targets = ["thumbv7em-none-eabihf"]

