[package]
name = "embassy-dt-bme280"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "BME280 temperature/humidity driver following the embassy-dt device-tree init convention."
keywords = ["embassy", "embedded", "bme280", "async", "sensor", "device-tree"]
categories = ["embedded", "no-std"]
documentation = "https://docs.rs/embassy-dt-bme280"
repository = "https://github.com/xingxingRealzyx/embassy-dt"

[dependencies]
embassy-dt = { path = "../..", version = "0.1.0" }
embedded-hal-async = "1.0"
